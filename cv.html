<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>©_CV</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="©_WebSite" />
  <link rel="manifest" href="favicon/site.webmanifest" />

  <style>
    :root {
      --bg-dim: rgba(0, 0, 0, 0);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 6px 20px rgba(0, 0, 0, 0.18);
      --maxw: 980px;
      --accent: #FF56FF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    /* fade-out della pagina al click su ©_ WebSite */
    body {
      transition: opacity .4s ease;
    }

    body.page-fade-out {
      opacity: 0;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      /* immagine di background */
      background-image:
        url("cv_bg.png");
      background-position: fixed;
      background-repeat: repeat;
      background-size: 100%;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10vh 3vw 12vh;

      overflow-y: scroll;
      scroll-behavior: smooth;
    }

    /* topbar minimale */
    .topbar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      gap: 8px;
    }

    /* === BOTTONI (bianchi, senza background o bordi) === */
    .chip {
      background: transparent;
      color: #FFFFFF;
      border: none;
      box-shadow: none;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 6px 10px;
      transition: color 0.25s ease, text-shadow 0.25s ease;
      cursor: pointer;
      user-select: none;
    }

    .chip:hover {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255, 86, 255, 0.6);
    }

    .right-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ===== Overlay scuro dietro la card ===== */
    .card-dim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.385);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
      z-index: 2;
    }

    .card-dim.show {
      opacity: 1;
      pointer-events: auto;
    }

    .card-dim[hidden] {
      display: none;
    }

    /* ===== CARD del PDF ===== */
    .pdf-card {
      transform-origin: top right;
      transition: transform .18s ease, opacity .18s ease;
      z-index: 3;
      position: relative;
    }

    .pdf-card.hide {
      transform: scale(0.92);
      opacity: 0;
      pointer-events: none;
    }

    .pdf-card[hidden] {
      display: none;
    }

    /* stack di pagine PDF */
    .pdf-stack {
      width: min(50vw, var(--maxw));
      max-width: var(--maxw);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .pdf-stack::after {
      content: "";
      display: block;
      height: 12vh;
    }

    .page {
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: 12px;
      overflow: hidden;
      display: inline-block;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    /* scrollbar cute/minimal */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #ffd0ff;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 20px;
      border: 2px solid #ff95ff;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #ff7aff;
    }

    /* =========================
       HINT in basso (fade + wave)
       ========================= */
    .hint {
      position: fixed;
      left: 16px;
      bottom: 25px;
      color: #ffd0ff;
      text-decoration: none;
      font-size: 12px;
      padding: 6px 10px;
      opacity: 0;
      transform: translateY(0);
      user-select: none;
      text-shadow: 0 0 15px rgba(50, 50, 50, 0.4);
      display: inline-block;
      white-space: pre;
      animation: hintFade 0.7s ease 1s forwards;
      z-index: 4;
    }

    .hint:hover {
      color: #ffd0ff57;
      text-shadow: 0 0 15px rgba(50, 50, 50, 0.4);
    }

    @keyframes hintFade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* wave "delicata" */
    .hint span {
      display: inline-block;
      opacity: 0;
      transform: translateY(0);
      animation: waveIn 0.45s ease forwards;
    }

    @keyframes waveIn {
      0% {
        opacity: 0;
        transform: translateY(0);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* micro-onda continua (intensità -5px) */
    @keyframes waveLoop {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .hint.wave span {
      opacity: 1;
      animation: waveLoop 3.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.06s);
    }
  </style>
</head>

<body>
  <div class="topbar">
    <a class="chip home-chip" href="index.html">©_ WebSite</a>
    <div class="right-actions">
      <a class="chip" href="curriculum.pdf" download title="Take">↓</a>
      <button class="chip toggle-card" type="button" title="Put away">🗁</button>
    </div>
  </div>

  <!-- Overlay scuro -->
  <div class="card-dim show" id="cardDim"></div>

  <!-- CARD PDF -->
  <div class="pdf-card" id="pdfCard">
    <div id="pdfStack" class="pdf-stack" aria-label="Curriculum vitae"></div>
  </div>

  <!-- Hint -->
  <a class="hint" href="curriculum.pdf" target="_blank" rel="noopener">
    Can't find my CV? Grab the PDF ↓
  </a>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      /* HINT WAVE */
      const hint = document.querySelector(".hint");
      if (hint) {
        const text = hint.textContent.trim();
        hint.textContent = "";
        [...text].forEach((char, i) => {
          const span = document.createElement("span");
          span.textContent = char;
          span.style.animationDelay = `${1 + i * 0.045}s`;
          span.style.setProperty('--i', i);
          hint.appendChild(span);
        });
        const total = 1 + (text.length - 1) * 0.045 + 0.45 + 0.1;
        setTimeout(() => hint.classList.add('wave'), total * 1000);
      }

      /* FADE-OUT su Home */
      const homeChip = document.querySelector('.home-chip');
      homeChip?.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.classList.add('page-fade-out');
        setTimeout(() => { window.location.href = 'index.html'; }, 400);
      });

      /* TOGGLE CARD + overlay */
      const pdfCard = document.getElementById('pdfCard');
      const cardDim = document.getElementById('cardDim');
      const toggleBtn = document.querySelector('.toggle-card');
      let isHidden = false, animating = false;

      function showOverlay() {
        cardDim.removeAttribute('hidden');
        void cardDim.offsetWidth;
        cardDim.classList.add('show');
      }

      function hideOverlay(callback) {
        cardDim.classList.remove('show');
        setTimeout(() => {
          cardDim.setAttribute('hidden', '');
          if (callback) callback();
        }, 200);
      }

      toggleBtn?.addEventListener('click', () => {
        if (animating) return;
        animating = true;
        if (!isHidden) {
          pdfCard.classList.add('hide');
          hideOverlay(() => { });
          setTimeout(() => {
            pdfCard.setAttribute('hidden', '');
            toggleBtn.textContent = '🗀';
            isHidden = true;
            animating = false;
          }, 200);
        } else {
          showOverlay();
          pdfCard.removeAttribute('hidden');
          void pdfCard.offsetWidth;
          pdfCard.classList.remove('hide');
          toggleBtn.textContent = '🗁';
          isHidden = false;
          setTimeout(() => { animating = false; }, 200);
        }
      });

      /* HINT apre PDF in nuova scheda */
      hint?.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = 'http://127.0.0.1:5500/curriculum.pdf';
      });
    });
  </script>

  <!-- PDF.js -->
  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.mjs";

    const url = "curriculum.pdf";
    const stack = document.getElementById("pdfStack");
    let pdf = null, rendering = false, lastCssWidth = 0, resizeTimer = null;

    async function ensurePDF() {
      if (!pdf) pdf = await pdfjsLib.getDocument(url).promise;
    }

    function cssWidth() { return Math.floor(stack.clientWidth); }

    async function renderAll() {
      if (rendering) return;
      await ensurePDF();

      const w = cssWidth();
      if (Math.abs(w - lastCssWidth) < 2 && stack.children.length) return;
      lastCssWidth = w;

      rendering = true;
      stack.innerHTML = "";

      const dpr = Math.max(window.devicePixelRatio || 1, 1);

      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const scaleCss = w / base.width;
        const vpCss = page.getViewport({ scale: scaleCss });
        const vpRender = page.getViewport({ scale: scaleCss * dpr });

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        canvas.width = Math.round(vpRender.width);
        canvas.height = Math.round(vpRender.height);
        canvas.style.width = Math.round(vpCss.width) + "px";
        canvas.style.height = Math.round(vpCss.height) + "px";

        const wrapper = document.createElement("div");
        wrapper.className = "page";
        wrapper.appendChild(canvas);
        stack.appendChild(wrapper);

        await page.render({ canvasContext: ctx, viewport: vpRender, intent: "display" }).promise;
      }

      rendering = false;
    }

    renderAll().then(() => window.scrollTo({ top: 0, behavior: 'instant' })).catch(console.error);
    const ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderAll, 200);
    });
    ro.observe(document.body);
  </script>
</body>

</html>
