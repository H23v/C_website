<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>©_ WebSite — mobile</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />

<body>
  <main class="stage">
    <div class="mobile-desk-wrap" aria-hidden="true">
      <model-viewer
        id="mobileDeskModel"
        class="mobile-desk-model"
        src="mydesk2.glb"
        alt="My desk 3D model"
        auto-rotate
        rotation-per-second="6deg"
        camera-controls
        interaction-prompt="none"
        touch-action="none"
        shadow-intensity="0"
        exposure="1"
        environment-image="neutral"
        field-of-view="28deg"
        camera-target="0m 0.12m 0m"
        camera-orbit="0deg 78deg 2.35m"
        min-camera-orbit="auto auto 2.35m"
        max-camera-orbit="auto auto 2.35m">
      </model-viewer>
    </div>

    <div class="personaggio home-personaggio">
      <span class="sparkles"></span>
      <span class="ascii-character"></span>

      <div id="asciiBubble" class="ascii-bubble" hidden>
        <pre aria-label="balloon-ascii">
╭◜◝ ͡ ◜◝╮
( <span class="icon-ribbon" role="button" tabindex="0" aria-label="ribbon">🎀</span> <span class="icon-idea" role="button" tabindex="0" aria-label="idea">💡</span> )
╰◟◞ ͜ ◟◞╯
        </pre>
      </div>
    </div>

    <nav class="menu mobile-main-menu" aria-label="Main">
      <button type="button" class="menu-link menu-me"><em>Me?</em></button>
      <button type="button" class="menu-link menu-artwork">Every Work</button>
      <a class="menu-link menu-cv" href="cv.html">CV</a>
    </nav>
  </main>

  <a class="mobile-footer-brand" href="index.html" aria-label="Vai alla home desktop">
    <span class="mobile-footer-symbol">©_</span>
    <span class="mobile-footer-text">WebSite</span>
  </a>

  <section id="meViewMobile" class="me-view-mobile" hidden>
    <nav class="me-top-nav" aria-label="Me navigation">
      <button type="button" class="me-top-link" data-target="work">Work</button>
      <button type="button" class="me-top-link" data-target="cv">Cv</button>
    </nav>

    <div class="personaggio me-personaggio" aria-hidden="true">
      <span class="sparkles"></span>
      <span class="ascii-character"></span>
    </div>

    <section id="bioMobile" class="bio-block">
      <div class="riga r1">©HIARA BERTASINI &nbsp;&nbsp; A. 2000, Verona (IT)</div>
      <div class="riga r2 rose2"><a href="tel:+393336218323">+39 3336218323</a></div>
      <div class="riga r3 rose2"><a href="mailto:chiarabertasini@hotmail.it">chiarabertasini@hotmail.it</a></div>
      <div class="riga r4 rose2">Inhabitant of the Net</div>
      <div class="riga r5 rose2">(っ ͡º ͜ʖ ͡º ς)</div>
      <div class="riga r6 rose2"><a href="https://www.linkedin.com/in/chiara-bertasini" target="_blank" rel="noopener noreferrer">[in]</a></div>
    </section>

    <section class="hack-block rose2">
      <div class="riga h1">| Co-founder of HACK</div>
      <div class="riga h2">ft. Adriana Ribalcenco</div>
      <div class="riga h3"><a href="https://sites.google.com/view/spacehackweb/spacehack" target="_blank" rel="noopener noreferrer">H_WebSite</a></div>
      <div class="riga h4"><a href="mailto:collettivo.hack@gmail.com">collettivo.hack@gmail.com</a></div>
    </section>

    <div class="text-fade-mask"></div>

    <aside id="mePanelMobile" class="me-panel-mobile">
      <div class="lang-toggle" role="tablist" aria-label="Language switch">
        <button type="button" class="lang-btn" data-lang="ita" aria-selected="false">ITA</button>
        <span class="slash"> / </span>
        <button type="button" class="lang-btn active" data-lang="eng" aria-selected="true">ENG</button>
      </div>

      <div class="panel-content" data-lang="eng"></div>
      <div class="panel-content" data-lang="ita" hidden></div>

    <section id="mobileCvSection" class="mobile-cv-section">
      <div class="mobile-cv-title">CV</div>
      <div class="mobile-cv-scroll">

    <div class="work-panel-header">Every Work</div>
    <div id="workListMobile" class="work-list-mobile"></div>
